name: backend-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: icea_db
          POSTGRES_USER: icea_user
          POSTGRES_PASSWORD: icea_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U icea_user -d icea_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: icea_db
      POSTGRES_USER: icea_user
      POSTGRES_PASSWORD: icea_pass
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migration drift
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Django check
        run: python backend/manage.py check

      - name: Apply migrations
        run: python backend/manage.py migrate --noinput

      - name: Run tests
        run: python backend/manage.py test
