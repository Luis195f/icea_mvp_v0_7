name: ci

on:
  push:
    branches: ["main", "fix/icea-ci-cd-risk-gates"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene and artifact guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BEFORE_SHA"...HEAD
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Block generated artifacts and real env files
        shell: bash
        run: |
          set -euo pipefail

          disallowed_paths="$(git ls-files | grep -E '(^|/)backend/models/.*\.json$|(^|/)db\.sqlite3$|\.sqlite3$|(^|/)__pycache__/|(^|/)\.pytest_cache/|(^|/)node_modules/|(^|/)coverage\.xml$|(^|/)\.coverage($|\.)' || true)"
          if [[ -n "$disallowed_paths" ]]; then
            echo "Generated/runtime artifacts must not be versioned:"
            echo "$disallowed_paths"
            exit 1
          fi

          real_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env(\.[A-Za-z0-9_-]+)?\.example$' || true)"
          if [[ -n "$real_env_files" ]]; then
            echo "Real .env files must not be versioned; commit only .env*.example templates:"
            echo "$real_env_files"
            exit 1
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "false"
      DATABASE_URL: sqlite:////tmp/icea-ci.sqlite3
      SECRET_KEY: ci-test-secret-not-for-production
      ICEA_DEV_ALLOW_INSECURE: "true"
      ICEA_AUTH_REQUIRED: "false"
      ICEA_RBAC_ENFORCE: "false"
      ICEA_SECURE_MODE: "false"
      ICEA_CAUSAL_DISCOVER_ENABLED: "false"
      ICEA_SIMULATE_ENABLED: "false"
      ICEA_FEDERATED_ENABLED: "false"
      ICEA_POLICY_LEARNING_ENABLED: "false"
      ICEA_FAIRNESS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run Django backend tests
        working-directory: backend
        run: python manage.py test -v 2

  backend-risk-regression-tests:
    name: Backend risk regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "false"
      DATABASE_URL: sqlite:////tmp/icea-risk-ci.sqlite3
      SECRET_KEY: ci-risk-test-secret-not-for-production
      ICEA_SECURE_MODE: "false"
      ICEA_CAUSAL_DISCOVER_ENABLED: "false"
      ICEA_SIMULATE_ENABLED: "false"
      ICEA_FEDERATED_ENABLED: "false"
      ICEA_POLICY_LEARNING_ENABLED: "false"
      ICEA_FAIRNESS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run contract, aggregation, and non-individualization guardrails
        working-directory: backend
        env:
          ICEA_DEV_ALLOW_INSECURE: "true"
          ICEA_AUTH_REQUIRED: "false"
          ICEA_RBAC_ENFORCE: "false"
          ICEA_SECURE_MODE: "false"
        run: |
          python manage.py test -v 2 \
            icea_core.tests.test_aggregation \
            icea_core.tests.test_api.ICEAPlusAPITests.test_score_endpoint_returns_contract_mismatch_for_handover_feature_space \
            icea_core.tests.test_api.ICEAPlusAPITests.test_score_endpoint_does_not_zero_fill_missing_model_features \
            icea_core.tests.test_api.ICEAPlusAPITests.test_score_endpoint_blocks_low_feature_coverage \
            icea_core.tests.test_api.ICEAPlusAPITests.test_score_endpoint_reference_rows_contract_mismatch_blocks_numeric_scoring \
            icea_core.tests.test_api.ICEAPlusAPITests.test_score_endpoint_reference_rows_low_feature_coverage_blocks_numeric_scoring \
            icea_core.tests.test_api.ICEAPlusAPITests.test_aggregate_endpoint_blocks_individualizable_grouping_and_suppresses_low_support \
            icea_core.tests.test_api.ICEAPlusAPITests.test_aggregate_endpoint_redacts_numeric_summary_when_any_cell_is_suppressed \
            icea_core.tests.test_api.ICEAPlusAPITests.test_followup_without_new_evidence_does_not_create_enriched_score \
            icea_core.tests.test_api.ICEAPlusAPITests.test_followup_status_and_patient_writeback_contract \
            icea_core.tests.test_api.ICEAPlusAPITests.test_writeback_summary_is_stable_and_degrades_team_to_unit \
            icea_core.tests.test_api.ICEAPlusAPITests.test_writeback_list_suppresses_episode_identifier_for_export_surface

      - name: Run fail-closed and RBAC guardrails
        working-directory: backend
        env:
          ICEA_DEV_ALLOW_INSECURE: "false"
          ICEA_AUTH_REQUIRED: "true"
          ICEA_RBAC_ENFORCE: "true"
          ICEA_SECURE_MODE: "true"
          JWT_SIGNING_KEY: ci-risk-jwt-signing-key-not-for-production
          AUDIT_LOG_SECRET: ci-risk-audit-secret-not-for-production
        run: |
          python manage.py test -v 2 \
            icea_core.tests.test_api_security_guards.ICEAApiSecurityGuardTests \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_sensitive_endpoints_reject_unauthenticated_requests \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_sensitive_endpoints_reject_insufficient_role \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_correct_roles_can_access_representative_sensitive_endpoints \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_secure_mode_without_token_keys_fails_explicitly \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_valid_api_key_gets_service_role_for_sensitive_endpoint \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_missing_or_invalid_api_key_cannot_access_sensitive_endpoint \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_spoofed_service_role_header_does_not_grant_service_access \
            icea_core.tests.test_security_fail_closed.ICEAFailClosedSecurityTests.test_secure_mode_blocks_dev_insecure_bypass_for_authenticated_user

  frontend-check:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/icea-nursing-command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/icea-nursing-command-center/package-lock.json

      - name: Validate frontend CI inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          node -e "const p=require('./package.json'); for (const s of ['lint','build']) { if (!p.scripts || !p.scripts[s]) { throw new Error('Missing required script: ' + s); } }"

      - name: Reject private registries in frontend lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const allowedHosts = new Set(['registry.npmjs.org']);
          const privateHints = [
            'packages.applied-caas-gateway',
            'internal.api.openai.org',
            'artifactory',
            'verdaccio',
            'npm.pkg.github.com',
            'pkgs.dev.azure.com',
          ];
          const offenders = [];
          for (const [name, entry] of Object.entries(lock.packages || {})) {
            const resolved = entry && entry.resolved;
            if (!resolved || !/^https?:\/\//.test(resolved)) {
              continue;
            }
            const url = new URL(resolved);
            if (url.protocol !== 'https:') {
              offenders.push(`${name || '<root>'}: package-lock resolved URL must use HTTPS: ${resolved}`);
              continue;
            }
            if (!allowedHosts.has(url.host) || privateHints.some((hint) => resolved.includes(hint))) {
              offenders.push(`${name || '<root>'}: package-lock resolved URL must use the public npm registry: ${resolved}`);
            }
          }
          if (offenders.length) {
            console.error('package-lock.json must use only HTTPS URLs from the public npm registry for CI reproducibility.');
            console.error(offenders.slice(0, 20).join('\n'));
            if (offenders.length > 20) {
              console.error(`...and ${offenders.length - 20} more`);
            }
            process.exit(1);
          }
          NODE

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "package-lock.json is required for reproducible CI installs."
            exit 1
          fi

      - name: Lint frontend
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script defined; skipping."
          fi

      - name: Test frontend if script exists
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "No test script defined; skipping."
          fi

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script defined; skipping."
          fi
