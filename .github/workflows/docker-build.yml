name: docker-build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: icea-backend:ci

  frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/icea-nursing-command-center
          file: ./frontend/icea-nursing-command-center/Dockerfile
          push: false
          tags: icea-frontend:ci
