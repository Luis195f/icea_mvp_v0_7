version: "3.9"

# Developer composition (MVP-friendly).
# Keeps bind-mounts and relaxed defaults. DO NOT use for PHI.

services:
  web:
    build: .
    container_name: icea_web_dev
    env_file:
      - ./.env.dev
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app/backend

  db:
    image: postgres:15
    container_name: icea_db_dev
    env_file:
      - ./.env.dev
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-icea_db}"
      POSTGRES_USER: "${POSTGRES_USER:-icea_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-icea_pass}"
    ports:
      - "5432:5432"
    volumes:
      - icea_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: icea_redis_dev
    ports:
      - "6379:6379"

  dashboard:
    image: python:3.12-slim
    container_name: icea_dashboard_dev
    working_dir: /app
    volumes:
      - ./dashboard:/app
    environment:
      ICEA_API_BASE: "http://web:8000/api/v1"
    command: ["bash", "-lc", "pip install -r requirements.txt && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - web


  ncc:
    image: node:20-alpine
    container_name: icea_ncc_dev
    working_dir: /app
    volumes:
      - ./frontend/icea-nursing-command-center:/app
      - icea_ncc_node_modules:/app/node_modules
    environment:
      ICEA_BACKEND_BASE_URL: "http://web:8000"
      ICEA_TENANT: "${ICEA_TENANT:-default}"
      # Optional: gate API key / audit signing secrets
      ICEA_API_KEY: "${ICEA_API_KEY:-}"
      ICEA_AUDIT_SECRET: "${AUDIT_LOG_SECRET:-}"
    command: ["sh", "-lc", "npm install && npm run dev -- -H 0.0.0.0 -p 3000"]
    ports:
      - "3000:3000"
    depends_on:
      - web

  scheduler:
    image: python:3.12-slim
    container_name: icea_scheduler_dev
    working_dir: /app
    volumes:
      - ./scheduler:/app
    environment:
      ICEA_API_BASE: "http://web:8000/api/v1"
      ICEA_TRAIN_INTERVAL_S: "${ICEA_TRAIN_INTERVAL_S:-86400}"
    command: ["bash", "-lc", "pip install -r requirements.txt && python run.py"]
    depends_on:
      - web

volumes:
  icea_pgdata:
